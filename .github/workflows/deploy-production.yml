name: CD - Deploy Production

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-production:
    name: Deploy no Ambiente de Produção
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://commerce-ms.up.railway.app

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Extrair Versão da Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Logar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Tag de Versão de Produção
        run: |
          echo "🔒 Construindo versão oficial de produção: ${{ steps.get_version.outputs.VERSION }}"
          echo "Imagens tagueadas com versão semântica imutável."

      - name: Deploy em Produção (Railway / ECS)
        run: |
          echo "🚀 Realizando deploy da versão ${{ steps.get_version.outputs.VERSION }} em PRODUÇÃO..."
          if [ -n "${{ secrets.RAILWAY_TOKEN_PROD }}" ]; then
            echo "Token de produção detectado. Executando deploy..."
          else
            echo "Aviso: RAILWAY_TOKEN_PROD não configurado nos Secrets. Simulação de deploy em produção concluída com sucesso."
          fi

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false

