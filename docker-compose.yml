version: "3.9"

# ─────────────────────────────────────────────────────────────
# commerce-ms — Ambiente de desenvolvimento local
# Sobe: PostgreSQL, Redis e nginx (load balancer)
# Os serviços Go são iniciados separadamente com `make dev`
# ─────────────────────────────────────────────────────────────

services:

  # ── Banco de dados principal ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce123}
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialização: cria os schemas por serviço
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache, Pub/Sub e rate limit ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    restart: unless-stopped
    # Habilita keyspace notifications (necessário para detectar carrinho abandonado)
    command: redis-server --notify-keyspace-events KEx
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Load Balancer ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: commerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:

