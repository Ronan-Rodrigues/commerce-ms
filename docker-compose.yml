version: "3.9"

# ─────────────────────────────────────────────────────────────
# commerce-ms — Orquestração de Microsserviços
# Sobe: PostgreSQL, Redis, 5 Serviços Go, API Gateway e nginx
# ─────────────────────────────────────────────────────────────

services:

  # ── Banco de Dados (PostgreSQL 16) ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce123}
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache & Pub/Sub (Redis 7) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    restart: unless-stopped
    command: redis-server --notify-keyspace-events KEx
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microsserviços ────────────────────────────────────────

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: commerce-auth
    restart: unless-stopped
    environment:
      AUTH_PORT: 8081
      DATABASE_URL: postgres://commerce:commerce123@postgres:5432/commerce?sslmode=disable&search_path=auth
      REDIS_ADDR: redis:6379
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: commerce-catalog
    restart: unless-stopped
    environment:
      CATALOG_PORT: 8082
      DATABASE_URL: postgres://commerce:commerce123@postgres:5432/commerce?sslmode=disable&search_path=catalog
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: commerce-order
    restart: unless-stopped
    environment:
      ORDER_PORT: 8083
      DATABASE_URL: postgres://commerce:commerce123@postgres:5432/commerce?sslmode=disable&search_path=orders
      REDIS_ADDR: redis:6379
      CATALOG_BASE_URL: http://catalog-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: commerce-payment
    restart: unless-stopped
    environment:
      PAYMENT_PORT: 8084
      DATABASE_URL: postgres://commerce:commerce123@postgres:5432/commerce?sslmode=disable&search_path=payments
      REDIS_ADDR: redis:6379
      ORDER_BASE_URL: http://order-service:8083
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notify-service:
    build:
      context: ./services/notify-service
      dockerfile: Dockerfile
    container_name: commerce-notify
    restart: unless-stopped
    environment:
      NOTIFY_PORT: 8085
      REDIS_ADDR: redis:6379
      N8N_BASE_URL: ${N8N_BASE_URL:-http://host.docker.internal:5678}
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy

  # ── API Gateway ───────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: commerce-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 8080
      REDIS_ADDR: redis:6379
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFY_SERVICE_URL: http://notify-service:8085
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - payment-service
      - notify-service

  # ── Load Balancer (nginx) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: commerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
