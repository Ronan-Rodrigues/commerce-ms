events {
    worker_connections 1024;
}

http {

    # ── Upstream: duas réplicas do gateway (load balance) ──────
    # Em produção, adicionar mais instâncias aqui
    upstream gateway {
        least_conn;
        server gateway:8080;
        # server gateway-2:8080;  # descomente ao escalar
    }

    # ── Configurações de segurança globais ─────────────────────
    server_tokens off;
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "no-referrer"      always;

    # ── Servidor principal ─────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Timeout para SSE (conexões longas)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Toda requisição passa pelo gateway
        location / {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;

            # Necessário para SSE (desabilita buffering)
            proxy_set_header   Connection      "";
            proxy_buffering    off;
            proxy_cache        off;

            # Repassa o IP real do cliente
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

